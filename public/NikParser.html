<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NIK Parser — Pemeriksaan KTP Indonesia</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: "Inter", sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
    .app-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; }
    .logo-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .logo-icon { width: 32px; height: 32px; color: var(--primary); }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- HEADER DENGAN LOGO SVG -->
    <div class="logo-header">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="8" x2="11" y2="8"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="7" y1="16" x2="15" y2="16"/><circle cx="15" cy="8" r="1.5"/>
      </svg>
      <div>
        <h1 style="font-size: 1.4rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;">NIK PARSER</h1>
        <p style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 600; letter-spacing: 0.5px;">Identity Verification</p>
      </div>
      <a href="index.html" class="btn-action" style="margin-left: auto; padding: 6px 12px; font-size: 0.75rem;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back
      </a>
    </div>

    <div class="media-card" style="padding: 20px; margin-bottom: 16px;">
      <label style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--text-secondary); display: block; margin-bottom: 8px; letter-spacing: 0.5px;">
        Masukkan 16 Digit NIK KTP:
      </label>
      <div style="display: flex; gap: 8px; margin-bottom: 12px;">
        <input
          type="text"
          id="nikInput"
          class="custom-text-input"
          placeholder="Contoh: 3201010101000001"
          maxlength="16"
          style="flex: 1; font-weight: 700; font-family: 'Space Mono', monospace;"
        />
        <button id="btnNikPaste" class="btn-action" title="Paste NIK">Paste</button>
      </div>
      <button id="btnNikParse" class="btn-primary-main">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        Parse & Analisis NIK
      </button>
    </div>

    <!-- Loading Spinner -->
    <div id="nikLoadingSpinner" class="media-card hidden" style="padding: 24px; text-align: center;">
      <span class="spinner"></span>
      <p style="margin-top: 10px; font-weight: 600; font-size: 0.9rem;">Memproses data NIK & wilayah...</p>
    </div>

    <!-- Result Container -->
    <div id="nikResultCard" class="media-card hidden"></div>
  </div>

  <script type="module">
    import { initNikParserEvents } from './js/modules/nikparser.js';
    initNikParserEvents();
  </script>
</body>
</html>
