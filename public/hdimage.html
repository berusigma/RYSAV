<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HD Image Upscaler — Tingkatkan Kualitas Foto AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: "Inter", sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
    .app-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; }
    .logo-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .logo-icon { width: 32px; height: 32px; color: var(--primary); }
    .drop-zone { border: 2px dashed var(--border-color); border-radius: 16px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s ease; background: var(--surface); }
    .drop-zone:hover { border-color: var(--primary); }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- HEADER -->
    <div class="logo-header">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      <div>
        <h1 style="font-size: 1.4rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;">HD IMAGE UPSCALER</h1>
        <p style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 600; letter-spacing: 0.5px;">WebAbility AI Image Enhancer</p>
      </div>
      <a href="index.html" class="btn-action" style="margin-left: auto; padding: 6px 12px; font-size: 0.75rem;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back
      </a>
    </div>

    <!-- FILE UPLOADER CARD -->
    <div class="media-card" style="padding: 20px; margin-bottom: 16px;">
      <label style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--text-secondary); display: block; margin-bottom: 10px; letter-spacing: 0.5px;">
        Pilih / Unggah Foto dari Galeri:
      </label>

      <input type="file" id="hdImageFileInput" accept="image/*" class="hidden" />
      
      <div id="hdImageDropZone" class="drop-zone">
        <svg style="width: 36px; height: 36px; color: var(--primary); margin-bottom: 8px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <p style="font-size: 0.88rem; font-weight: 700;">Klik untuk pilih foto dari galeri</p>
        <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px;">Atau seret dan lepas gambar ke sini</p>
      </div>

      <!-- PREVIEW CONTAINER -->
      <div id="hdImagePreviewContainer" class="hidden" style="margin-top: 16px; text-align: center;">
        <span style="font-size: 0.72rem; font-weight: 800; text-transform: uppercase; color: var(--text-secondary); display: block; margin-bottom: 6px;">Pratinjau Foto Asli</span>
        <img id="hdImagePreview" src="" style="max-height: 200px; width: 100%; object-fit: contain; border-radius: 12px; border: 1px solid var(--border-color);" />
      </div>

      <!-- OPTIONS -->
      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <div style="flex: 1;">
          <label style="font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--text-secondary); display: block; margin-bottom: 4px;">Skala Upscale:</label>
          <select id="hdImageScaleSelect" class="custom-select-input">
            <option value="2">2x (HD Super Sharp)</option>
            <option value="4">4x (Ultra HD 4K)</option>
          </select>
        </div>
        <div style="flex: 1;">
          <label style="font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--text-secondary); display: block; margin-bottom: 4px;">Mode AI:</label>
          <select id="hdImageModeSelect" class="custom-select-input">
            <option value="photo">Foto Realistis</option>
            <option value="anime">Anime / Ilustrasi</option>
          </select>
        </div>
      </div>

      <button id="btnHdImageSubmit" class="btn-primary-main" style="margin-top: 16px;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        Tingkatkan ke HD (Upscale)
      </button>
    </div>

    <!-- SPINNER -->
    <div id="hdImageSpinner" class="media-card hidden" style="padding: 30px; text-align: center; margin-bottom: 16px;">
      <span class="spinner"></span>
      <p style="margin-top: 10px; font-size: 0.88rem; font-weight: 600;">Memproses peningkatan HD dengan AI...</p>
    </div>

    <!-- RESULT CARD -->
    <div id="hdImageResultCard" class="media-card hidden"></div>
  </div>

  <script type="module">
    import { initHdImageEvents } from './js/modules/hdimager.js';
    initHdImageEvents();
  </script>
</body>
</html>
