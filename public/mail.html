<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RAY.MAIL — Disposable Temporary Email</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: "Inter", sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
    .app-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; }
    .logo-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .logo-icon { width: 32px; height: 32px; color: var(--primary); }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- HEADER DENGAN LOGO SVG -->
    <div class="logo-header">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
        <polyline points="22,6 12,13 2,6"></polyline>
      </svg>
      <div>
        <h1 style="font-size: 1.4rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;">RAY.MAIL</h1>
        <p style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 600; letter-spacing: 0.5px;">Disposable System</p>
      </div>
      <a href="index.html" class="btn-action" style="margin-left: auto; padding: 6px 12px; font-size: 0.75rem;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back
      </a>
    </div>

    <!-- ACTIVE EMAIL BANNER -->
    <div class="media-card" style="padding: 18px; margin-bottom: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
        <div>
          <span style="font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 1px;">Alamat Email Aktif</span>
          <div id="tempActiveEmailDisplay" style="font-size: 0.95rem; font-weight: 700; font-family: 'Space Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; color: var(--primary);">
            Belum Ada Email Aktif
          </div>
        </div>
        <span class="stat-pill" style="font-weight: 700;">MAIL.TM</span>
      </div>

      <!-- Quick Actions -->
      <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px;">
        <button id="btnCopyActiveEmail" class="btn-action" style="flex: 1;">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Salin
        </button>
        <button id="btnDeleteActiveEmail" class="btn-action danger" style="flex: 1;">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          Hapus
        </button>
      </div>

      <!-- Generate Email Button -->
      <button id="btnCreateEmail" class="btn-primary-main">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        Generate Email Baru
      </button>
    </div>

    <!-- ACCOUNT SWITCHER -->
    <div class="media-card" style="padding: 16px 20px; margin-bottom: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.5px;">Riwayat Email Tersimpan</span>
        <button id="btnRefreshHistoryList" class="btn-action" style="padding: 4px 8px; font-size: 0.7rem;">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        </button>
      </div>
      <div id="tempAccountsBar" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;">
        <!-- Injected dynamically -->
      </div>
    </div>

    <!-- MANUAL LOGIN -->
    <div class="media-card" style="margin-bottom: 16px;">
      <span style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--text-secondary); display: block; margin-bottom: 12px; letter-spacing: 0.5px;">Login Email Terdaftar</span>
      <div style="display: flex; gap: 10px;">
        <input type="email" id="tempManualLoginInput" class="custom-text-input" placeholder="alamat@domain.com" style="flex: 1;" />
        <button id="btnManualLogin" class="btn-action">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
        </button>
      </div>
    </div>

    <!-- INBOX SECTION -->
    <div class="media-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color);">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div id="tempPulseDot" style="width: 8px; height: 8px; border-radius: 50%; background: var(--text-main);"></div>
          <h3 style="font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">Inbox (<span id="tempMsgCounter">0</span>)</h3>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button id="btnSyncInbox" class="btn-action" style="padding: 4px 8px; font-size: 0.7rem;">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            Sync
          </button>
          <span style="font-size: 0.7rem; color: var(--text-secondary); font-weight: 700; letter-spacing: 0.5px;">15s</span>
        </div>
      </div>
      <div id="tempInboxList" class="temp-inbox-list" style="max-height: 380px; overflow-y: auto;"></div>
    </div>
  </div>

  <!-- READ MESSAGE MODAL -->
  <div id="tempReadMsgModal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <h3 id="tempReadSubject" style="font-weight: 800;">Subjek Pesan</h3>
        <button onclick="document.getElementById('tempReadMsgModal').classList.add('hidden')">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body">
        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px dashed var(--border-color);">
          <div style="margin-bottom: 4px;">Dari: <strong id="tempReadSender" style="color: var(--text-main);"></strong></div>
          <div id="tempReadTime" style="font-weight: 600;"></div>
        </div>
        <div id="tempReadBody" style="max-height: 350px; overflow-y: auto; line-height: 1.6; font-size: 0.95rem;"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initTempMailEvents } from './js/modules/tempmail.js';
    initTempMailEvents();
  </script>
</body>
</html>
