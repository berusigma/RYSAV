<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RAY.MAIL — Disposable Temporary Email</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: "Inter", sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
    .app-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; }
    .logo-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .logo-icon { width: 32px; height: 32px; color: var(--primary); }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- HEADER DENGAN LOGO SVG -->
    <div class="logo-header">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
        <polyline points="22,6 12,13 2,6"></polyline>
      </svg>
      <div>
        <h1 style="font-size: 1.4rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;">RAY.MAIL</h1>
        <p style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 600; letter-spacing: 0.5px;">Disposable System</p>
      </div>
      <a href="index.html" class="btn-action" style="margin-left: auto; padding: 6px 12px; font-size: 0.75rem;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back
      </a>
    </div>

    <!-- ACTIVE EMAIL BANNER -->
    <div class="media-card">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px;">
        <div>
          <span style="font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 1px;">Active Address</span>
          <div id="tempActiveEmailDisplay" style="font-size: 1.15rem; font-weight: 700; font-family: 'Space Mono', monospace; word-break: break-all; margin-top: 4px; color: var(--primary);">
            No Active Email
          </div>
        </div>
        <span id="tempActiveServerTag" class="stat-pill">SRV 1</span>
      </div>

      <!-- QUICK ACTIONS -->
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button id="btnCopyActiveEmail" class="btn-action" style="flex: 1;">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copy
        </button>
        <button id="btnDeleteActiveEmail" class="btn-action danger" style="flex: 1;">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          Delete
        </button>
      </div>
    </div>

    <!-- ACCOUNT SWITCHER -->
    <div class="media-card" style="padding: 16px 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.5px;">Saved Accounts</span>
        <button id="btnRefreshHistoryList" class="btn-action" style="padding: 4px 8px; font-size: 0.7rem;">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        </button>
      </div>
      <div id="tempAccountsBar" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;">
        <!-- Injected dynamically -->
      </div>
    </div>

    <!-- CREATE NEW EMAIL SECTION -->
    <div class="media-card">
      <h3 style="font-size: 1rem; font-weight: 800; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px;">Create New Email</h3>
      
      <!-- TAB SWITCHER -->
      <div style="display: flex; gap: 6px; background: var(--bg-color); padding: 4px; border-radius: 14px; margin-bottom: 20px; border: 1px solid var(--border-color);">
        <button id="tabServer1" class="temp-server-tab active">Fast Auto</button>
        <button id="tabServer2" class="temp-server-tab">Custom</button>
      </div>

      <!-- PANEL 1: SERVER 1 -->
      <div id="panelServer1" class="temp-server-panel">
        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5; font-weight: 500;">Generates a high-speed disposable email address on Server 1 (Mail.tm).</p>
        <button id="btnCreateServer1Email" class="btn-primary-main">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          Generate Email
        </button>
      </div>

      <!-- PANEL 2: SERVER 2 -->
      <div id="panelServer2" class="temp-server-panel hidden">
        <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px;">
          <div>
            <label style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 8px; letter-spacing: 0.5px; color: var(--text-secondary);">Custom Username</label>
            <input type="text" id="tempCustomNameInput" class="custom-text-input" placeholder="e.g. anon123" />
          </div>
          <div>
            <label style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 8px; letter-spacing: 0.5px; color: var(--text-secondary);">Select Domain</label>
            <select id="tempDomainSelectBox" class="custom-select-input">
              <option value="@gmail10p.com">@gmail10p.com</option>
              <option value="@oletters.com">@oletters.com</option>
              <option value="@oemails.com">@oemails.com</option>
              <option value="@oegmail.com">@oegmail.com</option>
              <option value="@suiemail.com">@suiemail.com</option>
              <option value="@voewo.com">@voewo.com</option>
              <option value="@yanemail.com">@yanemail.com</option>
            </select>
          </div>
        </div>
        <button id="btnCreateServer2Email" class="btn-primary-main">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          Create Custom
        </button>
      </div>

      <!-- MANUAL LOGIN -->
      <div style="margin-top: 24px; padding-top: 20px; border-top: 1px dashed var(--border-color);">
        <span style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--text-secondary); display: block; margin-bottom: 12px; letter-spacing: 0.5px;">Manual Login</span>
        <div style="display: flex; gap: 10px;">
          <input type="email" id="tempManualLoginInput" class="custom-text-input" placeholder="email@domain.com" style="flex: 1;" />
          <button id="btnManualLogin" class="btn-action">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- INBOX SECTION -->
    <div class="media-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color);">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div id="tempPulseDot" style="width: 8px; height: 8px; border-radius: 50%; background: var(--text-main);"></div>
          <h3 style="font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">Inbox (<span id="tempMsgCounter">0</span>)</h3>
        </div>
        <span style="font-size: 0.7rem; color: var(--text-secondary); font-weight: 700; letter-spacing: 0.5px;">SYNC 15s</span>
      </div>
      <div id="tempInboxList" class="temp-inbox-list" style="max-height: 380px; overflow-y: auto;"></div>
    </div>
  </div>

  <!-- READ MESSAGE MODAL -->
  <div id="tempReadMsgModal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <h3 id="tempReadSubject" style="font-weight: 800;">Message Subject</h3>
        <button onclick="document.getElementById('tempReadMsgModal').classList.add('hidden')">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body">
        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px dashed var(--border-color);">
          <div style="margin-bottom: 4px;">From: <strong id="tempReadSender" style="color: var(--text-main);"></strong></div>
          <div id="tempReadTime" style="font-weight: 600;"></div>
        </div>
        <div id="tempReadBody" style="max-height: 350px; overflow-y: auto; line-height: 1.6; font-size: 0.95rem;"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initTempMailEvents } from './js/modules/tempmail.js';
    initTempMailEvents();
  </script>
</body>
</html>
